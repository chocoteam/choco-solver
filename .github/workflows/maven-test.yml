# Builds the project and runs the tests, one job per TestNG group.
# A failed test does not stop Maven (-Dmaven.test.failure.ignore=true), so that every module is tested;
# scripts/test-failures.py then lists all the failed tests (log, annotations, job summary) and fails the job.

name: Java CI with Maven

on:
  push:
    branches: [ master, develop ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    paths-ignore: [ 'docs/**' ]

# A new push on a pull request cancels the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ibex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install ibex
        run: sh scripts/install-ibex.sh

      - name: Test Ibex
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/ibex/3rd
          mvn --file pom.xml test -Dmaven.test.failure.ignore=true -Dgroups=ibex

      - name: List the failed tests
        run: python3 scripts/test-failures.py

  test-solver:
    runs-on: ubuntu-latest
    strategy:
      # A failing group does not cancel the others
      fail-fast: false
      matrix:
        group: [ "1s", "10s", "checker", "lcg" ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test ${{ matrix.group }}
        run: mvn --file pom.xml test -Dmaven.test.failure.ignore=true -Dgroups=${{ matrix.group }}

      - name: List the failed tests
        run: python3 scripts/test-failures.py

  test-parser:
    runs-on: ubuntu-latest
    strategy:
      # A failing group does not cancel the others
      fail-fast: false
      matrix:
        group: [ "xcsp", "dimacs", "mps" ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test ${{ matrix.group }}
        run: mvn --file pom.xml test -Dmaven.test.failure.ignore=true -Dgroups=${{ matrix.group }}

      - name: List the failed tests
        run: python3 scripts/test-failures.py

  # Apart: it sometimes fails because the runner is too slow, and can then be re-run alone
  test-mzn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test mzn
        run: mvn --file pom.xml test -Dmaven.test.failure.ignore=true -Dgroups=mzn

      - name: List the failed tests
        run: python3 scripts/test-failures.py
