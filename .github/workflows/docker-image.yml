name: Docker Image CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # The Dockerfile copies the light jar of the parsers module
      - name: Build the jar
        run: mvn --file pom.xml -q package -DskipTests

      # Tag v6.0.2 gives images 6.0.2 (standard) and 6.0.2-X (with LCG), as build-images.sh does
      - name: Compute the image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the standard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: parsers/src/main/minizinc/docker/Dockerfile.dms
          platforms: linux/amd64
          push: true
          tags: chocoteam/choco-solver-mzn:${{ steps.version.outputs.version }}

      - name: Build and push the image with LCG
        uses: docker/build-push-action@v7
        with:
          context: .
          file: parsers/src/main/minizinc/docker/Dockerfile.dms
          platforms: linux/amd64
          push: true
          build-args: EXTRA_FZN_ARGS=-lcg
          tags: chocoteam/choco-solver-mzn:${{ steps.version.outputs.version }}-X
