# Checks that the documentation in docs/ still builds into the website.
# The site itself (theme, home page, deployment) lives in chocoteam/website,
# which imports docs/content and docs/static of this repository as a Hugo module.
# Here, the website is built against the checked-out sources instead of the pinned version.

name: Documentation

on:
  pull_request:
    paths: [ 'docs/**', '.github/workflows/docs.yml' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.160.1

jobs:
  build-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: choco-solver
      - uses: actions/checkout@v4
        with:
          repository: chocoteam/website
          path: website
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Build the website with these docs
        working-directory: website
        env:
          HUGO_MODULE_REPLACEMENTS: github.com/chocoteam/choco-solver -> ${{ github.workspace }}/choco-solver
        run: |
          npm ci
          hugo --gc --minify
