# Static analysis of the Java code with CodeQL, results in the Security tab of the repository.

name: "CodeQL"

on:
  push:
    branches: [ master, develop ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    branches: [ develop ]
    paths-ignore: [ 'docs/**' ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Build
        run: mvn --file pom.xml -B -q package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
